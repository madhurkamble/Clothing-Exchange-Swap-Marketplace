<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Clothing Exchange & Swap Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">♻</span>
        <span>ClothSwap</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Join ClothSwap</h2>
        <p>Start exchanging clothes and living sustainably</p>
      </div>

      <div id="alertBox" class="alert alert-hidden"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input 
            type="text" 
            id="name" 
            class="form-control" 
            placeholder="e.g. Sarah Miller" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="sarah@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="location">City / Location</label>
          <input 
            type="text" 
            id="location" 
            class="form-control" 
            placeholder="e.g. Seattle, WA" 
            autocomplete="address-level2"
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input 
            type="tel" 
            id="phone" 
            class="form-control" 
            placeholder="e.g. +1 555-0123" 
            autocomplete="tel"
          >
        </div>

        <div class="form-group">
          <label for="password">Password (minimum 6 characters) *</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Clothing Exchange & Swap Marketplace.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
